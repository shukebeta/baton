name: backfill-v051

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild binaries for (e.g. v0.5.1)
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build locked release binary
        shell: bash
        run: cargo build --locked --release --target "${TARGET}"

      - name: Verify binary version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          binary="target/${TARGET}/release/baton"
          if [[ "${TARGET}" == *-windows-* ]]; then
            binary="${binary}.exe"
          fi
          test "$("./${binary}" --version)" = "baton ${version}"

      - name: Archive Unix binary
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="baton-${version}-${TARGET}.tar.gz"
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT
          cp "target/${TARGET}/release/baton" "${staging}/baton"
          tar -C "${staging}" -czf "${archive}" baton

      - name: Archive Windows binary
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "baton-$version-$($env:TARGET).zip"
          $staging = Join-Path $env:RUNNER_TEMP "baton-archive-$($env:TARGET)"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/$($env:TARGET)/release/baton.exe" (Join-Path $staging "baton.exe")
          Compress-Archive -LiteralPath (Join-Path $staging "baton.exe") -DestinationPath $archive -Force

      - name: Upload target archive
        uses: actions/upload-artifact@v6
        with:
          name: baton-${{ matrix.target }}
          path: baton-*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
